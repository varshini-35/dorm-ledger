<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dorm Ledger | Login</title>

  <link rel="stylesheet" href="login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-page">

  <!-- LOGO -->
  <div class="logo">
    <h1><span>D</span>orm Ledger</h1>
  </div>

  <!-- ROLE SELECTION -->
  <div class="role-toggle">

    <div class="role active" onclick="switchRole('student', this)">
      <img 
        src="https://cdn-icons-png.flaticon.com/512/3135/3135810.png"
        alt="Student icon">
      <span>Student</span>
    </div>

    <div class="role" onclick="switchRole('Admin', this)">
      <img 
        src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
        alt="Admin icon">
      <span>Admin</span>
    </div>

  </div>

  <!-- LOGIN CARD -->
  <div class="login-card">

    <!-- STUDENT LOGIN -->
    <div id="student-login" class="form">
      <input type="text" placeholder="Phone Number" />
      <input type="password" placeholder="Password" />
    </div>

    <!-- AdDMIN LOGIN -->
    <div id="admin-login" class="form hidden">
      <input type="email" placeholder="College Email ID" />
      <input type="password" placeholder="Password" />
      <p class="note">
        Admin phone login is enabled only after authorization
      </p>
    </div>

    <button class="login-btn">Login</button>

  </div>

</div>

<script src="login.js"></script>
</body>
</html>
